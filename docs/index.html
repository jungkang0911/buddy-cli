<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Jiao Jiao Demo</title>
<style>
:root{--bg:#f4f1ea;--fg:#2a2a2a;--muted:#6b6b6b;--btn:#fff;--line:#d9d4c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--fg:#ececec;--muted:#9a9a9a;--btn:#25242a;--line:#38363d}}
:root[data-theme="dark"]{--bg:#17161a;--fg:#ececec;--muted:#9a9a9a;--btn:#25242a;--line:#38363d}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:24px 16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}
.term{background:#0e0f14;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.bar{background:#24252c;padding:8px 12px;display:flex;gap:6px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%}.bar span{color:#999;font-size:12px;margin-left:8px}
.scr{overflow-x:auto;padding:10px 12px}
pre{margin:0;font:13px/1.25 ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;color:#d6d6d6;white-space:pre}
.b{font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 8px}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button.on{border-color:#e07aa8;color:#e07aa8}
input[type=range]{flex:1;min-width:160px}
.label{font-weight:600;color:#e07aa8;min-height:1.5em}
.scenes{display:flex;flex-wrap:wrap;gap:6px}
.scenes button{font-size:13px;padding:4px 10px}
</style></head><body><div class="wrap">
<h1>buddy-cli 🐾 Jiao Jiao</h1><p class="sub">A real recording of <code>buddy.py</code> in a 72×22 terminal, pressing each key in turn. Click a scene to jump to it. <a href="https://github.com/jungkang0911/buddy-cli" style="color:#e07aa8">GitHub</a></p>
<div class="term"><div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><span>python buddy.py</span></div>
<div class="scr"><pre id="s"></pre></div></div>
<div class="ctl"><button id="pp">⏸ Pause</button><input type="range" id="rg" min="0" value="0"><span id="ct" style="color:var(--muted);font-size:13px"></span></div>
<div class="label" id="lb"></div>
<div class="scenes" id="sc"></div>
</div>
